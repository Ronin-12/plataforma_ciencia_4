# nginx para Mupi: sirve la página (frontend compilado) y pasa /api/ a la API.
# Copiar a /etc/nginx/sites-available/mupi, enlazar en sites-enabled y cambiar TU_DOMINIO.
# El certificado HTTPS lo agrega certbot (ver docs/despliegue_ionos.md).

server {
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Página: los archivos de `npm run build` (frontend/dist)
    root /opt/mupi/frontend/dist;
    index index.html;

    # Los materiales que sube el docente pesan hasta 20 MB (+ margen del formulario).
    client_max_body_size 25m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # La barra final quita el prefijo /api: /api/docentes/login -> /docentes/login
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        # La API lee esta cabecera solo si CONFIAR_EN_PROXY=true (límites por IP reales).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # generar un juego con IA puede tardar
    }

    # React maneja sus propias pantallas: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella (assets/*.js) pueden guardarse en caché mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
