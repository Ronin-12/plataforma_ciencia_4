name: CI

# Corre en cada pull request y en cada push a main: pruebas del backend (con PostgreSQL real),
# lint y compilación del frontend. Un PR no debería fusionarse con esta revisión en rojo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murcielago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murcielago_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Crear tablas y aplicar migraciones (en orden)
        run: |
          psql -h 127.0.0.1 -U postgres -d murcielago_test -v ON_ERROR_STOP=1 -f db/schema_v2.sql
          for archivo in $(ls db/migraciones/*.sql | sort); do
            echo "Aplicando $archivo"
            psql -h 127.0.0.1 -U postgres -d murcielago_test -v ON_ERROR_STOP=1 -f "$archivo"
          done
      - name: Pruebas
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
